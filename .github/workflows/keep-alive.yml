name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        run: |
          if [ -z "${{ vars.KEEP_ALIVE_URL }}" ]; then
            echo "KEEP_ALIVE_URL repo variable is not set — skipping ping."
            exit 0
          fi
          curl -fsS --max-time 20 "${{ vars.KEEP_ALIVE_URL }}/up"
