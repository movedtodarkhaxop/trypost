[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
; REVERB_SERVER_HOST defaults to 0.0.0.0 (directly reachable, e.g. via the
; compose.prod.yaml "8080:8080" port mapping). Platforms that only support a
; single public port (e.g. Render) should set REVERB_SERVER_HOST=127.0.0.1 —
; nginx already proxies /app/ and /apps/ to Reverb internally, so it never
; needs to be publicly reachable on its own port there.
command=/bin/sh -c "php /var/www/html/artisan reverb:start --host=${REVERB_SERVER_HOST:-0.0.0.0} --port=8080"
autostart=true
autorestart=unexpected
exitcodes=0,2
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
; DISABLE_HORIZON=true skips this in-container (runs as sleep infinity instead)
; for deployments that run the queue worker as its own separate service/process
; (e.g. a dedicated Render background worker) to keep this container's memory
; footprint down on memory-constrained plans.
command=/bin/sh -c "[ \"${DISABLE_HORIZON:-false}\" = \"true\" ] && exec sleep infinity || exec php /var/www/html/artisan horizon"
autostart=true
autorestart=true
priority=30
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; DISABLE_SCHEDULER=true — see DISABLE_HORIZON above, same rationale.
command=/bin/sh -c "[ \"${DISABLE_SCHEDULER:-false}\" = \"true\" ] && exec sleep infinity || exec php /var/www/html/artisan schedule:work"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
